params:
  # theme
  showToc: true
  TocOpen: false
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  hideMeta: false

  # for enhanced SEO
  env: production
  description: "Manasseh Mwangi — Cloud & DevOps Engineer specializing in AWS, Kubernetes, Terraform, and CI/CD. AWS Certified Solutions Architect Associate and KCNA certified."

  # Home Page
  profileMode:
    enabled: true
    title: "Manasseh Mwangi"
    subtitle: |
      Hi 👋, I'm a Cloud☁️ & DevOps Engineer dedicated to building secure, high-performance, and scalable systems. I thrive at the intersection of reliability and innovation. Currently an AWS Certified Solutions Architect Associate, I'm actively deepening my expertise toward the Professional level.
       
    
    imageUrl: "home/mwangi2.jpg"
    imageWidth: 220
    imageHeight: 220
    buttons:
      - name: Resume
        url: "https://drive.google.com/file/d/1rnxzhYMuFuTTD_wTB48wzn4hQklH8mv9/view?usp=drive_link"

    

  # List View
  hideDescriptionInList: false

  # cover image for posts
  cover:
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  socialIcons:
    - name: "email"
      url: "mailto:manassehmwangi9@gmail.com"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/manassehmwangi/"
    - name: "github"
      url: "https://github.com/ManassehMwangi"
    - name: "cv"
      url: "https://drive.google.com/file/d/1IXzn2Oop_ZIoFisWrs6I5Qkv8sTEHl--/view?usp=sharing"

  # text search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

# for search using Fuse.js
outputs:
  home:
    - HTML
    - RSS
    - JSON

# allow HTML in MD
markup:
  goldmark:
    renderer:
      unsafe: true


  
